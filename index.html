<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="shortcut icon" href="./favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta property="og:image" content="./icon-512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1117" />
    <meta name="description" content="LPREX — Your LP, rebalanced automatically. Auto-rebalancing for concentrated liquidity on Uniswap v3 and HyperSwap V3." />
    <title>LPREX | LP Auto-Rebalancing System</title>
    <style>html,body{color:#e8eef3;background:#0b1117;margin:0;font-family:Hiragino Sans,Noto Sans JP,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Noto Sans,Ubuntu,Cantarell,Helvetica Neue,sans-serif}#boot{text-align:center;padding:48px 20px;font-size:15px;line-height:1.7}#boot b{color:#3ddc97;letter-spacing:.14em;font-size:18px}#boot-err{text-align:left;color:#ff9b9b;word-break:break-all;background:#1a1215;border:1px solid #5a2a2a;border-radius:10px;max-width:520px;margin:16px auto 0;padding:10px 12px;font-size:12px;display:none}</style>
    <script>
      // 画面が出ないときに原因を表示する（読み込み失敗・古いブラウザなど）
      (function () {
        function show(msg) {
          var el = document.getElementById("boot-err");
          if (!el) return;
          el.style.display = "block";
          el.textContent += (el.textContent ? "\n" : "") + msg;
        }
        window.addEventListener("error", function (e) {
          var t = e && e.target;
          if (t && (t.tagName === "SCRIPT" || t.tagName === "LINK")) show("Could not load file: " + (t.src || t.href));
          else show("Error: " + (e.message || "unknown"));
        }, true);
        window.addEventListener("unhandledrejection", function (e) { show("Error: " + (e.reason && e.reason.message || e.reason)); });
        setTimeout(function () {
          if (document.getElementById("boot")) show("The page did not load within 30 seconds. Your connection may be slow or this browser may not be supported. Please reload.");
        }, 30000);
      })();
    </script>
    <script type="module" crossorigin src="./app.js?v=mwdidwo3"></script>
    <link rel="stylesheet" crossorigin href="./index.css?v=mwdidwo3">
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <b id="boot-name">◆ LPREX</b><br />Loading…
        <script>
          // MYLP のドメインで開いたら、読み込み中の表示も MYLP にする
          (function () {
            var h = location.hostname, q = location.search, b = null;
            try { b = localStorage.getItem("lprex.brand"); } catch (e) {}
            var my = /mylp|my-pool|mypool/.test(h) || /brand=mylp/.test(q) || (!/lprex/.test(h) && !/brand=lprex/.test(q) && b === "mylp");
            if (my) { var el = document.getElementById("boot-name"); el.textContent = "◆ MYLP"; el.style.color = "#5aa8ff"; document.title = "MYLP | LP Auto-Rebalancing System"; }
          })();
        </script>
        <div id="boot-err"></div>
      </div>
    </div>
  </body>
</html>
